# Render Blueprint — Akrabiolab backend (Django) + PostgreSQL (free tier)
# Deploy: https://dashboard.render.com  ->  New  ->  Blueprint  ->  select this repo

databases:
  - name: akrabiolab-db
    plan: free
    databaseName: akrabiolab
    user: akrabiolab

services:
  - type: web
    name: akrabiolab-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py loaddata initial_data.json
    startCommand: gunicorn core.wsgi
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: akrabiolab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: WEB_CONCURRENCY
        value: "2"
